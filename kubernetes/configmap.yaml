###############################################################################
# File Name   : 02-configmap.yaml
#
# Description :
# -----------------------------------------------------------------------------
# This ConfigMap stores all non-sensitive configuration values used by
# the Backend Application.
#
# Responsibilities:
#   1. Store Backend Port
#   2. Store MySQL Service Name
#   3. Store Database Name
#   4. Store Database Port
#
# NOTE:
# Passwords and usernames should NOT be stored here.
# They belong in Kubernetes Secrets.
#
###############################################################################

apiVersion: v1

kind: ConfigMap

metadata:

  name: backend-config

  namespace: employee-app

data:

  #########################################################################
  # Backend Configuration
  #########################################################################

  PORT: "5000"

  #########################################################################
  # MySQL Configuration
  #########################################################################

  # Kubernetes Service Name for MySQL
  DB_HOST: "mysql-service"

  # MySQL Service Port
  DB_PORT: "3306"

  # Database Name
  DB_NAME: "employee_db"