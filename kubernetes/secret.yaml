###############################################################################
# File Name : secret.yaml
#
# Description:
# -----------------------------------------------------------------------------
# This Secret stores all sensitive information required by the application.
#
# Stored Values:
#
# - MySQL Root Password
# - Database Username
# - Database Password
#
# NOTE:
# Kubernetes automatically encodes stringData values into Base64.
#
###############################################################################

apiVersion: v1

kind: Secret

metadata:

  name: mysql-secret

  namespace: employee-app

  labels:

    app: employee-crud

type: Opaque

stringData:

  ###########################################################################
  # MySQL Credentials
  ###########################################################################

  MYSQL_ROOT_PASSWORD: root123

  DB_USER: root

  DB_PASSWORD: root123