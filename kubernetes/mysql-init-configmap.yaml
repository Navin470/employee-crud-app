###############################################################################
# File Name : mysql-init-configmap.yaml
#
# Description:
# -----------------------------------------------------------------------------
# This ConfigMap stores the SQL initialization script.
#
# When the MySQL container starts for the FIRST time, it automatically executes
# every .sql file found in:
#
#     /docker-entrypoint-initdb.d/
#
# This script will:
#   1. Create employee_db
#   2. Create employees table
#   3. Insert sample records
#
###############################################################################

apiVersion: v1

kind: ConfigMap

metadata:
  name: mysql-init-script

  namespace: employee-app

  labels:
    app: mysql

data:

  ###########################################################################
  # Database Initialization Script
  ###########################################################################

  init.sql: |
    CREATE DATABASE IF NOT EXISTS employee_db;

    USE employee_db;

    CREATE TABLE IF NOT EXISTS employees (

      id INT AUTO_INCREMENT PRIMARY KEY,

      name VARCHAR(100) NOT NULL,

      email VARCHAR(150) NOT NULL UNIQUE,

      department VARCHAR(100) NOT NULL,

      designation VARCHAR(100) NOT NULL,

      salary DECIMAL(10,2) NOT NULL,

      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP

    );

    INSERT INTO employees
    (name, email, department, designation, salary)
    VALUES
    ('John Doe', 'john@example.com', 'IT', 'Software Engineer', 60000),

    ('Alice Smith', 'alice@example.com', 'HR', 'HR Manager', 55000),

    ('Bob Johnson', 'bob@example.com', 'Finance', 'Accountant', 50000);