###############################################################################
# File Name : configmap.yaml
#
# Description:
# -----------------------------------------------------------------------------
# This ConfigMap stores all NON-SENSITIVE configuration values used by
# the Backend Application.
#
# Values stored here:
#
# - Backend Port
# - Database Host
# - Database Port
# - Database Name
#
# NOTE:
# Never store passwords in ConfigMap.
# Passwords belong in Kubernetes Secret.
#
###############################################################################

apiVersion: v1

kind: ConfigMap

metadata:

  name: backend-config

  namespace: employee-app

  labels:

    app: employee-crud

data:

  ###########################################################################
  # Backend Configuration
  ###########################################################################

  PORT: "5000"

  ###########################################################################
  # MySQL Configuration
  ###########################################################################

  # Kubernetes Service Name
  DB_HOST: "mysql-service"

  # MySQL Service Port
  DB_PORT: "3306"

  # Database Name
  DB_NAME: "employee_db"