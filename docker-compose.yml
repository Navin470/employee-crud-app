version: "3.9"

services:

  ##############################################################
  # MySQL Database
  ##############################################################

  mysql:

    image: mysql:8.0

    container_name: mysql

    restart: always

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: employee_db

    ports:

      - "3306:3306"

    volumes:

      - mysql_data:/var/lib/mysql

      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  ##############################################################
  # Backend
  ##############################################################

  backend:

    build:

      context: ./backend

    container_name: backend

    restart: always

    depends_on:

      - mysql

    environment:

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: employee_db
      PORT: 5000

    ports:

      - "5000:5000"

  ##############################################################
  # Frontend
  ##############################################################

  frontend:

    build:

      context: ./frontend

    container_name: frontend

    depends_on:

      - backend

    ports:

      - "8080:80"

volumes:

  mysql_data: